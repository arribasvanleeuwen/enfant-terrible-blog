<style>
  /* 1. TÍTULOS Y COLORES (Blanco Puro y Rosa) */
  .post-list-heading, .page-heading, .post-title {
    color: #ffffff !important;
    font-weight: 700 !important;
    border: none !important;
    margin-bottom: 30px !important;
  }

  .post-card h3 a {
    color: #FF0B55 !important; /* Rosa por defecto */
    text-decoration: none !important;
    font-size: 22px !important;
    transition: 0.2s;
  }

  .post-card h3 a:hover {
    color: #ffffff !important; /* Blanco al pasar el ratón */
  }

  /* 2. SUBTÍTULOS H2 DENTRO DE POSTS (Blanco con RAYA ROSA) */
  .post-content h2 {
    color: #ffffff !important;
    border-bottom: 2px solid #FF0B55 !important;
    padding-bottom: 8px !important;
    margin-top: 40px !important;
    display: block !important;
  }

  /* 3. ESTRUCTURA DE LA HOME Y ALINEACIÓN DE IMAGEN */
  .post-card {
    display: flex !important;
    gap: 25px !important;
    margin-bottom: 40px !important;
    padding-bottom: 30px !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important; /* Raya divisoria */
    align-items: flex-start !important; /* Alineación superior */
  }

  .post-thumb {
    flex-shrink: 0 !important;
    width: 220px !important;
    margin-top: 5px !important; /* AJUSTE CRUCIAL: Alinea la foto con el texto */
    line-height: 0 !important;
  }

  .post-thumb img {
    width: 100% !important;
    border-radius: 8px !important;
    display: block !important;
  }

  /* 4. AJUSTE DE TÍTULO PARA ALINEACIÓN */
  .post-card h3 {
    margin: 0 0 10px 0 !important; /* Quita el margen superior que descuadraba */
  }

  /* 5. COHERENCIA PARA POSTS SIN IMAGEN (Centrado) */
  .post-card:not(:has(.post-thumb)) {
    justify-content: center !important;
    text-align: center !important;
  }

  .excerpt-text {
    color: #bbbbbb !important;
    font-size: 15px !important;
    line-height: 1.5 !important;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 6. RESPONSIVE MÓVIL */
  @media screen and (max-width: 600px) {
    .post-card { 
      flex-direction: column !important; 
      align-items: center !important;
      text-align: center !important;
    }
    .post-thumb { width: 100% !important; }
  }
</style>
