<style>
  /* 1. RAYAS DIVISORIAS ENTRE POSTS EN LA HOME */
  .post-card {
    display: flex;
    gap: 25px;
    margin-bottom: 40px;
    padding-bottom: 30px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important; /* Raya recuperada */
    align-items: flex-start;
    width: 100%;
  }

  /* 2. COHERENCIA CUANDO NO HAY IMAGEN (Centrado) */
  .post-card:not(:has(.post-thumb)) {
    justify-content: center;
    text-align: center;
  }

  .post-card:not(:has(.post-thumb)) .post-excerpt-container {
    max-width: 800px; /* Evita que el texto se estire demasiado y sea difícil de leer */
  }

  .post-card:not(:has(.post-thumb)) .excerpt-text {
    -webkit-line-clamp: unset; /* Permitimos más texto si es solo editorial */
  }

  /* 3. TÍTULOS EN HOME (Rosa -> Blanco al pasar el ratón) */
  .post-card h3 a {
    color: #FF0B55 !important;
    text-decoration: none !important;
    font-size: 22px !important;
    transition: 0.2s;
  }

  .post-card h3 a:hover {
    color: #ffffff !important;
  }

  /* 4. ESTRUCTURA CON IMAGEN */
  .post-thumb {
    flex-shrink: 0;
    width: 220px;
  }

  .post-thumb img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }

  .excerpt-text {
    color: #bbbbbb !important;
    font-size: 15px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 5. RESPONSIVE MÓVIL */
  @media screen and (max-width: 600px) {
    .post-card { 
      flex-direction: column; 
      align-items: center; 
      text-align: center;
    }
    .post-thumb { width: 100%; }
  }
  .post-card { align-items: flex-start !important; }
  .post-thumb { margin-top: 5px !important; }
  .post-card h3 { margin-top: 0 !important; }
</style>
