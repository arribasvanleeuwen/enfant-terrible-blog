name: Create Individual YouTube Posts
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser

      - name: Generate Posts
        shell: python
        run: |
          import feedparser
          import os
          import re
          import unicodedata
          from datetime import datetime

          FEED_URL = "https://www.youtube.com/feeds/videos.xml?playlist_id=PL7nodL-Tlw8XoChvA8Db7rRCSjd39Mv_M"
          POSTS_DIR = "_posts"

          if not os.path.exists(POSTS_DIR):
              os.makedirs(POSTS_DIR)

          def slugify(value):
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode('ascii')
              value = re.sub(r'[^\w\s-]', '', value).strip().lower()
              return re.sub(r'[-\s]+', '-', value)

          feed = feedparser.parse(FEED_URL)

          for entry in feed.entries:
              video_id = entry.yt_videoid
              title = entry.title.replace('"', '\\"') # Escapar comillas en el título
              published = entry.published_parsed
              date_str = datetime(*published[:6]).strftime('%Y-%m-%d')
              date_full = datetime(*published[:6]).strftime('%Y-%m-%d %H:%M:%S')
              
              title_slug = slugify(entry.title)
              filename = f"{date_str}-{title_slug}.md"
              filepath = os.path.join(POSTS_DIR, filename)

              if not os.path.exists(filepath):
                  # Usamos hqdefault por si el video no tiene miniatura en máxima resolución
                  thumb_url = f"https://img.youtube.com/vi/{video_id}/hqdefault.jpg"
                  
                  content = f"""---
          layout: post
          title: "{title}"
          date: {date_full}
          thumbnail: "{thumb_url}"
          ---

          <img src="{thumb_url}" alt="{title}" style="width:100%; border-radius:10px; margin-bottom:20px;">

          <div class="video-container" style="margin-bottom: 25px;">
            <iframe width="100%" height="450" src="https://www.youtube.com/embed/{video_id}" frameborder="0" allowfullscreen style="border-radius:12px; border:none;"></iframe>
          </div>

          {entry.summary}

          ---
          [📺 Watch on Youtube]({entry.link})
          """
                  # Escribimos el archivo asegurándonos de que no haya sangrías extrañas al inicio
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content.strip())
                  print(f"Post generado con éxito: {filename}")

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          git commit -m "Corrección de miniaturas y formato de posts" || exit 0
          git push
