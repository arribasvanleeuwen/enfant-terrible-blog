name: Create Individual YouTube Posts
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Generate Posts
        shell: python
        run: |
          import feedparser
          import os
          import re
          import unicodedata
          import requests
          from datetime import datetime

          FEED_URL = "https://www.youtube.com/feeds/videos.xml?playlist_id=PL7nodL-Tlw8XoChvA8Db7rRCSjd39Mv_M"
          POSTS_DIR = "_posts"

          if not os.path.exists(POSTS_DIR):
              os.makedirs(POSTS_DIR)

          def slugify(value):
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode('ascii')
              value = re.sub(r'[^\w\s-]', '', value).strip().lower()
              return re.sub(r'[-\s]+', '-', value)

          def get_best_thumbnail(v_id):
              max_res_url = f"https://img.youtube.com/vi/{v_id}/maxresdefault.jpg"
              response = requests.head(max_res_url, allow_redirects=True)
              if response.status_code == 200:
                  return max_res_url
              return f"https://img.youtube.com/vi/{v_id}/sddefault.jpg"

          existing_video_ids = set()
          if os.path.exists(POSTS_DIR):
              for filename in os.listdir(POSTS_DIR):
                  if filename.endswith(".md"):
                      with open(os.path.join(POSTS_DIR, filename), "r", encoding="utf-8") as f:
                          content = f.read()
                          match = re.search(r'youtube_id:\s*([a-zA-Z0-9_-]+)', content)
                          if match:
                              existing_video_ids.add(match.group(1).strip())

          feed = feedparser.parse(FEED_URL)

          for entry in feed.entries:
              video_id = entry.yt_videoid
              if video_id in existing_video_ids:
                  continue

              title = entry.title.replace('"', '\\"')
              published = entry.published_parsed
              date_str = datetime(*published[:6]).strftime('%Y-%m-%d')
              date_full = datetime(*published[:6]).strftime('%Y-%m-%d %H:%M:%S')
              filepath = os.path.join(POSTS_DIR, f"{date_str}-{slugify(entry.title)}.md")

              if not os.path.exists(filepath):
                  thumb_url = get_best_thumbnail(video_id)
                  
                  paragraphs = re.split(r'\n\s*\n', entry.summary.strip())
                  content_paragraphs = paragraphs[2:-1] if len(paragraphs) > 3 else paragraphs

                  formatted_paragraphs = []
                  rosa_web = "#FF0B55"
                  summary_text = ""

                  for p in content_paragraphs:
                      p = p.strip()
                      if not p: continue
                      
                      p = re.sub(r'^\d{1,2}:\d{2}.*$', '', p, flags=re.MULTILINE).strip()
                      
                      if p.startswith(('-', '•', '*', '/')):
                          p = re.sub(r'^[-•*/]+\s*', '', p).strip()

                      if not p: continue
                      
                      if re.search(r'^[^\w\s].*[A-ZÁÉÍÓÚÑ]{2,}', p):
                          p_html = f'<h3 style="color: #ffffff; margin-top: 35px; border-bottom: 2px solid {rosa_web}; padding-bottom: 8px; font-weight: 700; text-transform: uppercase; font-size: 1.3em;">{p}</h3>'
                      elif len(formatted_paragraphs) > 0 and "SUMMARY" in formatted_paragraphs[-1]:
                          summary_text = p.replace('"', "'").replace('\n', ' ')
                          p_html = f'<div style="background: #1a1a1a; border-left: 5px solid {rosa_web}; padding: 20px; margin: 25px 0; border-radius: 6px; color: #ffffff; font-style: italic; font-size: 1em; line-height: 1.6;">{p}</div>'
                      elif "store.steampowered.com/app/" in p:
                          steam_match = re.search(r'https://store\.steampowered\.com/app/(\d+)', p)
                          if steam_match:
                              game_id = steam_match.group(1)
                              # ÚNICO CAMBIO: Añadido max-width: 100% para evitar flechas en móvil
                              p_html = f'<iframe src="https://store.steampowered.com/widget/{game_id}/" frameborder="0" width="100%" height="190" style="margin: 25px 0; border-radius: 8px; max-width: 100%;"></iframe>'
                          else:
                              p_html = re.sub(r'(https?://[^\s]+)', f'<a href="\\1" target="_blank" style="color: {rosa_web}; font-weight: bold;">\\1</a>', p)
                      else:
                          p_html = re.sub(r'(https?://[^\s]+)', f'<a href="\\1" target="_blank" style="color: {rosa_web}; font-weight: bold;">\\1</a>', p)
                          p_html = p_html.replace('\n', '<br>')
                      
                      formatted_paragraphs.append(p_html)

                  description = "\n\n".join(formatted_paragraphs)
                  if len(summary_text) > 160: summary_text = summary_text[:157] + "..."
                  
                  post_content = f"""---
          layout: post
          title: "{title}"
          date: {date_full}
          thumbnail: "{thumb_url}"
          youtube_id: {video_id}
          excerpt: "{summary_text}"
          ---

          <div class="video-post-wrapper" style="max-width: 800px; margin: 0 auto; font-family: sans-serif;">
            <a href="{entry.link}" target="_blank" style="display: block; position: relative; border-radius: 18px; overflow: hidden; margin-bottom: 35px;">
              <img src="{thumb_url}" style="width: 100%; display: block;">
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: rgba(255, 11, 85, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <div style="width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 25px solid white; margin-left: 5px;"></div>
              </div>
            </a>
            <div class="description-container">{description}</div>
          </div>
          """
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(post_content.strip())

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          git commit -m "Auto-post: Fix steam embed width for mobile" || exit 0
          git push
